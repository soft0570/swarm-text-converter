<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Swarm Text Converter</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #111827;
      --sub: #6b7280;
      --border: #d1d5db;
      --button: #111827;
      --buttonSub: #6b7280;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }
    .container { max-width: 760px; margin: 0 auto; }
    .card {
      background: var(--card);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
    }
    h1 { margin: 0 0 10px 0; font-size: 2rem; line-height: 1.2; }
    p.desc { margin: 0 0 16px 0; color: var(--sub); line-height: 1.6; }
    textarea {
      width: 100%;
      min-height: 160px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      line-height: 1.5;
      background: white;
      margin-bottom: 14px;
    }
    .buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
    button {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 15px;
      cursor: pointer;
      color: white;
      background: var(--button);
    }
    button.secondary { background: var(--buttonSub); }
    .output {
      min-height: 100px;
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fafafa;
      padding: 14px;
      font-size: 16px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Swarm Text Converter</h1>
      <p class="desc">Swarmの共有URLを貼り付けて変換します。</p>

      <textarea id="input" placeholder="ここにSwarmのURLを貼り付けてください"></textarea>

      <div class="buttons">
        <button onclick="convertText()">変換</button>
        <button class="secondary" onclick="pasteText()">ペースト</button>
        <button class="secondary" onclick="copyResult()">コピー</button>
        <button class="secondary" onclick="postToX()">Xに投稿</button>
        <button class="secondary" onclick="clearAll()">クリア</button>
      </div>

      <div id="output" class="output">ここに変換結果が表示されます</div>
    </div>
  </div>

  <script>
    // ※ 作成した Cloudflare Worker の URL を指定
    const WORKER_API_URL = "https://frosty-leaf-658b.y09064054612.workers.dev/";

    function normalizeUrl(text) {
      const match = text.match(/https?:\/\/(?:app\.foursquare\.com|(?:www\.)?swarmapp\.com)\/share\/checkin\/\S+/i);
      if (!match) return "";

      return match[0]
        .replace("app.foursquare.com", "swarmapp.com")
        .replace("www.swarmapp.com", "swarmapp.com")
        .replace(/lang=ja\b/i, "lang=en");
    }

    // ogTitle から "I'm at 会場名 in 区, 都道府県" のフォーマットを抽出・整形
    function formatLocationText(ogTitle) {
      if (!ogTitle) return "";

      // 既に "I'm at ..." で始まっている場合
      if (/^I'm at/i.test(ogTitle)) {
        return ogTitle;
      }

      // "明治神宮野球場 in 新宿区, 東京都" 形式の場合に "I'm at " を補完
      return `I'm at ${ogTitle}`;
    }

    async function convertText() {
      const input = document.getElementById("input").value.trim();
      const output = document.getElementById("output");

      const url = normalizeUrl(input);
      if (!url) {
        alert("有効なSwarmのURLを入力してください");
        return;
      }

      output.textContent = "解析中...";

      try {
        const res = await fetch(`${WORKER_API_URL}?url=${encodeURIComponent(url)}`);
        const data = await res.json();

        if (data.ogTitle) {
          const locationText = formatLocationText(data.ogTitle);
          output.textContent = `${locationText} ${url}`.trim();
        } else {
          output.textContent = "場所情報を取得できませんでした。";
        }
      } catch (e) {
        console.error(e);
        output.textContent = "通信エラーが発生しました。WorkerのURLを確認してください。";
      }
    }

    async function pasteText() {
      try {
        const clipText = await navigator.clipboard.readText();
        if (clipText) {
          document.getElementById("input").value = clipText;
          await convertText();
        }
      } catch (e) {
        alert("ペーストに失敗しました");
      }
    }

    async function copyResult() {
      const text = document.getElementById("output").textContent.trim();
      if (!text || text === "ここに変換結果が表示されます" || text === "解析中...") return;
      await navigator.clipboard.writeText(text);
      alert("コピーしました");
    }

    function postToX() {
      const text = document.getElementById("output").textContent.trim();
      if (!text || text === "ここに変換結果が表示されます" || text === "解析中...") return;
      location.href = `twitter://post?message=${encodeURIComponent(text)}`;
    }

    function clearAll() {
      document.getElementById("input").value = "";
      document.getElementById("output").textContent = "ここに変換結果が表示されます";
      document.getElementById("input").focus();
    }
  </script>
</body>
</html>
