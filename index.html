<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Swarm Text Converter</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #111827;
      --sub: #6b7280;
      --border: #d1d5db;
      --button: #111827;
      --buttonSub: #6b7280;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }
    .container { max-width: 760px; margin: 0 auto; }
    .card {
      background: var(--card);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
    }
    h1 { margin: 0 0 10px 0; font-size: 2rem; line-height: 1.2; }
    p.desc { margin: 0 0 16px 0; color: var(--sub); line-height: 1.6; }
    
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 0.95rem;
    }

    input[type="text"], textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
      line-height: 1.5;
      background: white;
      margin-bottom: 14px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .options {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
      background: #f9fafb;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .options label {
      font-weight: normal;
      margin: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
    button {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 15px;
      cursor: pointer;
      color: white;
      background: var(--button);
    }
    button.secondary { background: var(--buttonSub); }
    .output {
      min-height: 100px;
      white-space: pre-wrap;
      word-break: break-word;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fafafa;
      padding: 14px;
      font-size: 16px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Swarm Text Converter</h1>
      <p class="desc">Swarmの共有URLを貼り付けて変換します。</p>

      <label for="eventInput">イベント名・追記事項（任意）</label>
      <input type="text" id="eventInput" placeholder="例: ミュージカル公演 劇団東少 人魚姫">

      <label for="input">SwarmのURL / 共有文章</label>
      <textarea id="input" placeholder="ここにSwarmのURLまたは共有テキストを貼り付けてください"></textarea>

      <label>出力フォーマット</label>
      <div class="options">
        <label><input type="radio" name="formatMode" value="auto" checked> 自動判定（イベントあり→@ / なし→I'm at）</label>
        <label><input type="radio" name="formatMode" value="at"> `@` 形式強制</label>
        <label><input type="radio" name="formatMode" value="imat"> `I'm at` 形式強制</label>
      </div>

      <div class="buttons">
        <button onclick="convertText()">変換</button>
        <button class="secondary" onclick="pasteText()">ペースト</button>
        <button class="secondary" onclick="copyResult()">コピー</button>
        <button class="secondary" onclick="postToX()">Xに投稿</button>
        <button class="secondary" onclick="clearAll()">クリア</button>
      </div>

      <div id="output" class="output">ここに変換結果が表示されます</div>
    </div>
  </div>

  <script>
    const WORKER_API_URL = "https://frosty-leaf-658b.y09064054612.workers.dev";

    function normalizeUrl(text) {
      const match = text.match(/https?:\/\/(?:app\.foursquare\.com|(?:www\.)?swarmapp\.com)\/share\/checkin\/\S+/i);
      if (!match) return "";

      return match[0]
        .replace("app.foursquare.com", "swarmapp.com")
        .replace("www.swarmapp.com", "swarmapp.com")
        .replace(/lang=ja\b/i, "lang=en");
    }

    // テキスト欄からイベント名を拾うフォールバックロジック
    function extractEventFromInputText(inputText) {
      if (!inputText) return "";
      const quoteMatch = inputText.match(/"([\s\S]*?)"/);
      if (quoteMatch && quoteMatch[1].trim()) return quoteMatch[1].trim();

      const urlIndex = inputText.search(/https?:\/\//i);
      let textBeforeUrl = urlIndex !== -1 ? inputText.substring(0, urlIndex) : inputText;

      textBeforeUrl = textBeforeUrl
        .replace(/I'm at .*?in .*/gi, "")
        .replace(/I'm at .*/gi, "")
        .replace(/この\s*$/, "")
        .trim();

      return textBeforeUrl;
    }

    async function convertText() {
      const input = document.getElementById("input").value.trim();
      const manualEvent = document.getElementById("eventInput").value.trim();
      const output = document.getElementById("output");

      const url = normalizeUrl(input);
      if (!url) {
        alert("有効なSwarmのURLを入力してください");
        return;
      }

      output.textContent = "解析中...";

      try {
        const res = await fetch(`${WORKER_API_URL}?url=${encodeURIComponent(url)}`);
        const data = await res.json();

        if (!data.venue) {
          output.textContent = "場所情報を取得できませんでした。";
          return;
        }

        // イベント名の確定（入力ボックス優先 ＞ テキスト解析）
        const eventText = manualEvent || extractEventFromInputText(input);

        // 住所フォーマット
        let locationPart = "";
        if (data.ward && data.prefecture) {
          locationPart = `in ${data.ward}, ${data.prefecture}`;
        } else if (data.prefecture) {
          locationPart = `in ${data.prefecture}`;
        }

        const mode = document.querySelector('input[name="formatMode"]:checked').value;
        let formattedResult = "";

        // 出力モード判定
        const useAtFormat = (mode === "at") || (mode === "auto" && eventText !== "");

        if (useAtFormat) {
          // @ 形式: [イベント名] (@ [会場] in [区], [都道府県]) [URL]
          const venueInfo = locationPart ? `@ ${data.venue} ${locationPart}` : `@ ${data.venue}`;
          const prefix = eventText ? `${eventText} ` : "";
          formattedResult = `${prefix}(${venueInfo.trim()}) ${url}`;
        } else {
          // I'm at 形式: [イベント名] I'm at [会場] in [区], [都道府県] [URL]
          const venueInfo = locationPart ? `${data.venue} ${locationPart}` : data.venue;
          const prefix = eventText ? `${eventText} ` : "";
          formattedResult = `${prefix}I'm at ${venueInfo.trim()} ${url}`;
        }

        output.textContent = formattedResult.trim();

      } catch (e) {
        console.error(e);
        output.textContent = "通信エラーが発生しました。WorkerのURLを確認してください。";
      }
    }

    async function pasteText() {
      try {
        const clipText = await navigator.clipboard.readText();
        if (clipText) {
          document.getElementById("input").value = clipText;
          await convertText();
        }
      } catch (e) {
        alert("ペーストに失敗しました");
      }
    }

    async function copyResult() {
      const text = document.getElementById("output").textContent.trim();
      if (!text || text === "ここに変換結果が表示されます" || text === "解析中...") return;
      await navigator.clipboard.writeText(text);
      alert("コピーしました");
    }

    function postToX() {
      const text = document.getElementById("output").textContent.trim();
      if (!text || text === "ここに変換結果が表示されます" || text === "解析中...") return;
      location.href = `twitter://post?message=${encodeURIComponent(text)}`;
    }

    function clearAll() {
      document.getElementById("eventInput").value = "";
      document.getElementById("input").value = "";
      document.getElementById("output").textContent = "ここに変換結果が表示されます";
      document.getElementById("eventInput").focus();
    }
  </script>
</body>
</html>
